<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERMIRAV HERMES — Display</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050E0A; font-family:'Oswald', sans-serif; color:#FFF; overflow:hidden; width:100vw; height:100vh; }
#display { width:100vw; height:100vh; padding: 1vh 2.5vw 0.5vh 2.5vw; display:flex; flex-direction:column; justify-content:space-between; }

/* HEADER */
.header {
  text-align:center; padding-bottom:0.2vh; margin-bottom:0vh;
  border-bottom:3px solid #F2C660; flex:0 0 auto;
}
.title-card {
  display:flex; align-items:center; justify-content:center; width:90vw;
  padding:0.8vh 2vw; margin-bottom:0vh; margin-left:auto; margin-right:auto; border-radius:10px; box-sizing:border-box;
  background:linear-gradient(135deg, #F7E3A1 0%, #6B4E12 55%, #050E0A 100%);
  border:2px solid #FFE9A8;
  position:relative; overflow:hidden;
  box-shadow: 0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 14px rgba(232,200,122,0.5);
}
.title-card::before {
  content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.35), transparent);
  transform:skewX(-20deg);
  animation: goldShine 2s ease-in-out infinite;
}
@keyframes goldShine {
  0% { left: -60%; }
  100% { left: 140%; }
}
.logo-name {
  font-size:7.5vw; font-weight:900; letter-spacing:1.5px; line-height:1; position:relative; z-index:1; white-space:nowrap;
  background:linear-gradient(90deg, #F0FFF8, #FFFFFF, #E0FFF0, #FFFFFF, #F0FFF8);
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  animation: shimmerText 2s linear infinite;
  text-shadow:0 2px 8px rgba(184,134,11,0.4);
}
@keyframes shimmerText { 0%{background-position:0% center;} 100%{background-position:200% center;} }

.cube-wrap { perspective:600px; height:8.5vw; margin-top:0.3vh; flex:0 0 auto; width:auto; min-width:66vw; }
.cube { position:relative; width:100%; height:100%; transform-style:preserve-3d; animation: cubeFlip 7s ease-in-out infinite; }
.cube-face {
  position:absolute; inset:0; backface-visibility:hidden;
  display:flex; align-items:center; justify-content:center;
  font-size:7vw; font-weight:900; letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap;
  background:linear-gradient(90deg, #B8860B, #FFE9A8, #F2C660, #FFE9A8, #B8860B);
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.cube-face.front { transform:rotateX(0deg) translateZ(4vw); }
.cube-face.back { transform:rotateX(180deg) translateZ(4vw); }
@keyframes cubeFlip {
  0%, 42% { transform:rotateX(0deg); }
  50%, 92% { transform:rotateX(180deg); }
  100% { transform:rotateX(360deg); }
}

/* ANTET TABEL */
.col-headers { display:grid; grid-template-columns: 7% 44% 49%; padding:0.2vh 0 0vh 0; margin-bottom:0vh; column-gap:0.8vw; flex:0 0 auto; }
.col-h { display:flex; flex-direction:column; align-items:center; }
.col-h-ro { font-size:4.6vw; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#F2C660; }
.col-h-en { font-size:4.2vw; font-weight:900; letter-spacing:1px; text-transform:uppercase; margin-top:0.1vh; background:linear-gradient(180deg, #FFFFFF 0%, #FFF3C4 100%); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; -webkit-text-stroke:0.4px #B8860B; }
.col-h:first-child { align-items:flex-start; }
.col-h:nth-child(2) { padding-left:19vw; }
.col-h:last-child { align-items:center; padding-left:8vw; padding-right:0vw; }

/* TABEL VALUTE */
#ratesTable { 
  flex:1 1 auto; 
  display:flex; 
  flex-direction:column; 
  justify-content:space-between; 
  width:100%; 
  margin:0.2vh 0 0.5vh 0;
}
.rate-row { 
  display:grid; 
  grid-template-columns: 18% 82%; 
  align-items:stretch; 
  flex:1; 
  width:100%; 
}

.code-wrap { 
  display:flex; 
  align-items:center; 
  justify-content:flex-start; 
  width:100%; 
  height:92%;
  overflow:hidden; 
  position:relative; 
}

.code {
  font-size:11.5vw; font-weight:900; display:inline-block; line-height:1; 
  transform: scaleX(0.78) scaleY(1.55); 
  transform-origin: left center; 
  white-space:nowrap;
  background:linear-gradient(90deg, #B8860B, #FFE9A8, #F2C660, #FFE9A8, #B8860B);
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  animation: shimmerText 5s linear infinite;
}

@keyframes shimmerCode {
  0% { background-position: 0% center; }
  100% { background-position: 200% center; }
}

.rate-card-grid {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5vw;
  width: 100%;
  height: 92%;
  align-items: center;
}

.rate-card { 
  display:flex; 
  justify-content:center; 
  align-items:center; 
  border-radius:0.6vw; 
  overflow:hidden; 
  width:100%; 
  padding:0; 
  height:100%;
}

.val { 
  font-size: 12vw; 
  font-weight: 900; 
  line-height: 1; 
  display: flex; 
  justify-content: center; 
  align-items: center; 
  box-sizing: border-box; 
  width: 100%; 
  height: 100%;
  white-space: nowrap; 
  transform: scaleY(1.45);
  transform-origin: center center;
}

.digit { display: inline-block; width: 0.58em; text-align: center; }
.digit-dot { display: inline-block; width: 0.22em; text-align: center; }

.buy { color:#FFFFFF; background: linear-gradient(135deg, #FFE9A8 0%, #F2C660 15%, #C9A227 40%, #A6791A 60%, #8B6508 78%, #4A3308 100%); }
.sell { color:#FFFFFF; background: linear-gradient(135deg, #FF9494 0%, #E23C3C 15%, #B33030 40%, #921F1F 60%, #6E1414 78%, #350808 100%); }

/* SECTIUNEA AUR — AURIU COMPLET, TEXT ALB, BANNER SHINE LA 2s */
.gold-section { padding-top:0.2vh; margin-top:0vh; text-align:center; flex:0 0 auto; }
.gold-title-bar { display:flex; align-items:center; justify-content:center; gap:2.8vw; margin-bottom:0.4vh; }
.gold-title-bar::before, .gold-title-bar::after { content:''; flex:1; max-width:12vw; height:4px; background:linear-gradient(90deg, transparent, #FFD700, transparent); }
.gold-cube-wrap { height:8.5vw; flex:0 0 auto; width:auto; min-width:58vw; }
.gold-face { font-size:7.5vw; letter-spacing:1px; background:linear-gradient(90deg, #B8860B, #FFE9A8, #F2C660, #FFE9A8, #B8860B); background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.gold-face.front { transform:rotateX(0deg) translateZ(3.5vw); }
.gold-face.back { transform:rotateX(180deg) translateZ(3.5vw); }

.gold-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.6vh 2.5vw; margin-bottom:0.8vh; border-radius:12px;
  background:linear-gradient(135deg, #6B4E12 0%, #A67C1E 45%, #6B4E12 100%);
  border:2px solid #FFD98A;
  position:relative; overflow:hidden;
  box-shadow: 0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
}

.gold-item::before {
  content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.25), transparent);
  transform:skewX(-20deg);
  animation: goldShine 2s ease-in-out infinite;
}

.gold-txt {
  color: #FFFFFF;
  font-size: 7vw;
  font-weight: 900;
  letter-spacing: 1px;
  white-space: nowrap;
  position: relative; z-index: 1;
  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
}

.gold-val-wrap { 
  display:flex; align-items:baseline; justify-content:flex-end; gap:1.2vw; white-space:nowrap;
  position: relative; z-index: 1;
}
.gold-upto { font-size:4vw; font-weight:700; color:#FFFFFF; letter-spacing:1px; text-transform:uppercase; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
.gold-val { font-size:7.5vw; font-weight:900; color:#FFFFFF; letter-spacing:1px; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }
.gold-currency { font-size:6.3vw; font-weight:900; color:#FFFFFF; letter-spacing:1px; text-shadow: 0 2px 6px rgba(0,0,0,0.6); }

.loading-msg { color:#888E99; text-align:center; font-size:4vw; padding:4vh 0; }

/* ADMIN PANEL */
#admin { display:none; position:fixed; inset:0; background:#050608; z-index:9999; padding:20px; overflow-y:auto; }
.admin-panel { max-width:600px; margin:0 auto; background:#14171E; border-radius:14px; border:2px solid #FFF; padding:20px; }
.admin-panel h2 { color:#F2C660; text-align:center; margin-bottom:20px; }
.admin-row-header { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:6px; text-align:center; font-size:13px; letter-spacing:1px; color:#888E99; }
.admin-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:10px; align-items:center; }
.admin-row span { color:#F2C660; font-weight:900; font-size:22px; }
.admin-input { background:#0B0C10; border:2px solid #FFF; color:#F2C660; font-size:24px; padding:10px; text-align:center; border-radius:6px; width:100%; font-family:'Oswald',sans-serif; }
.admin-input:focus { outline:none; border-color:#F2C660; }
.gold-title { color:#F2C660; margin:20px 0 10px; font-size:16px; letter-spacing:2px; text-align:center; }
.btn-save { width:100%; padding:18px; background:#FFF; border:none; color:#000; font-weight:900; font-size:18px; letter-spacing:2px; cursor:pointer; margin-top:16px; border-radius:8px; }
.btn-save:disabled { opacity:0.4; }
.btn-close { width:100%; margin-top:10px; padding:12px; background:none; border:1px solid #888E99; color:#888E99; border-radius:8px; cursor:pointer; font-family:'Oswald',sans-serif; letter-spacing:2px; }
.save-msg { text-align:center; margin-top:12px; font-weight:900; min-height:20px; }
.save-msg.ok { color:#3EE07A; }
.save-msg.err { color:#FF4D4D; }

.admin-photos { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
.admin-photo-wrap { display:flex; flex-direction:column; align-items:center; gap:6px; }
.admin-photo-wrap img { width:70px; height:70px; border-radius:50%; object-fit:cover; border:2px solid #F2C660; }
.admin-photo-wrap span { color:#F2C660; font-size:13px; letter-spacing:1px; }

</style>
</head>

<button onclick="openAdmin()" style="position:fixed; bottom:0; right:0; opacity:0; width:60px; height:60px; border:none; background:none;"></button>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, get, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyD7K-y9cX-fPbpGOetaCTwe8G8gpMy-ML0",
  authDomain: "sermirav-exchange.firebaseapp.com",
  databaseURL: "https://sermirav-exchange-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sermirav-exchange",
  storageBucket: "sermirav-exchange.firebasestorage.app",
  messagingSenderId: "913088674029",
  appId: "1:913088674029:web:8c3a77e3c5f5925a7fb4e4"
};
const db = getDatabase(initializeApp(firebaseConfig));
const hermesRef = ref(db, 'hermesSimplu');

const DEFAULT_DATA = {
  rates: [
    { code:'EUR', buy:5.1490, sell:5.2330 },
    { code:'USD', buy:4.4490, sell:4.5300 },
    { code:'GBP', buy:6.0090, sell:6.1100 },
    { code:'CHF', buy:5.5090, sell:5.5950 },
    { code:'CAD', buy:3.1250, sell:3.2650 },
    { code:'AUD', buy:2.6900, sell:3.1100 },
    { code:'PLN', buy:1.1050, sell:1.2550 },
    { code:'TRY', buy:0.0950, sell:0.1190 },
    { code:'HUF', buy:0.0132, sell:0.0149 }
  ],
  gold: { k14: 325, k18: 405 }
};

window.openAdmin = () => {
  const p = prompt("Parolă:");
  if (p === '2580') {
    renderAdmin();
    document.getElementById('admin').style.display = 'block';
  } else if (p !== null) {
    alert('Parolă incorectă');
  }
};
window.closeAdmin = () => { document.getElementById('admin').style.display = 'none'; };

let secretBuffer = '', secretTimer = null;
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT') return;
  secretBuffer += e.key;
  if (secretTimer) clearTimeout(secretTimer);
  secretTimer = setTimeout(() => { secretBuffer = ''; }, 2000);
  if (secretBuffer.includes('2580')) {
    secretBuffer = '';
    renderAdmin();
    document.getElementById('admin').style.display = 'block';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') window.closeAdmin(); });

let CURRENCIES = DEFAULT_DATA.rates.map(r => ({ ...r }));
let GOLD = { ...DEFAULT_DATA.gold };

function tabularNum(str) {
  return str.split('').map(ch => {
    if (ch >= '0' && ch <= '9') return `<span class="digit">${ch}</span>`;
    return `<span class="digit-dot">${ch}</span>`;
  }).join('');
}

function renderDisplay() {
  document.getElementById('ratesTable').innerHTML = CURRENCIES.map(r => `
    <div class="rate-row">
      <div class="code-wrap"><div class="code">${r.code}</div></div>
      <div class="rate-card-grid">
        <div class="rate-card buy">
          <div class="val" data-code="${r.code}" data-field="buy">${tabularNum(r.buy.toFixed(4))}</div>
        </div>
        <div class="rate-card sell">
          <div class="val" data-code="${r.code}" data-field="sell">${tabularNum(r.sell.toFixed(4))}</div>
        </div>
      </div>
    </div>
  `).join('');
  document.getElementById('g14').innerText = GOLD.k14;
  document.getElementById('g18').innerText = GOLD.k18;
}

function renderAdmin() {
  document.getElementById('adminRows').innerHTML = CURRENCIES.map((r, i) => `
    <div class="admin-row">
      <span>${r.code}</span>
      <input type="number" id="buy-${i}" class="admin-input" value="${r.buy}" step="0.0001" min="0">
      <input type="number" id="sell-${i}" class="admin-input" value="${r.sell}" step="0.0001" min="0">
    </div>
  `).join('');
  document.getElementById('adm-g14').value = GOLD.k14;
  document.getElementById('adm-g18').value = GOLD.k18;
}

function isAdminOpen() {
  return document.getElementById('admin').style.display === 'block';
}

async function load() {
  if (isAdminOpen()) return;
  try {
    const snap = await get(hermesRef);
    const d = snap.val();
    if (d && Array.isArray(d.rates)) {
      d.rates.forEach(r => {
        const idx = CURRENCIES.findIndex(c => c.code === r.code);
        if (idx >= 0) { CURRENCIES[idx].buy = r.buy; CURRENCIES[idx].sell = r.sell; }
      });
    }
    if (d && d.gold) {
      if (typeof d.gold.k14 === 'number') GOLD.k14 = d.gold.k14;
      if (typeof d.gold.k18 === 'number') GOLD.k18 = d.gold.k18;
    }
    if (!d) {
      await set(hermesRef, { rates: CURRENCIES, gold: GOLD });
    }
    renderDisplay();
    renderAdmin();
  } catch (e) {
    document.getElementById('ratesTable').innerHTML = `<div class="loading-msg">Eroare la încărcare: ${e.message}</div>`;
  }
}

function readValidNumber(id, fallback) {
  const raw = document.getElementById(id).value;
  const val = parseFloat(raw);
  if (isNaN(val) || val < 0) return fallback;
  return val;
}

window.saveAll = async () => {
  const btn = document.getElementById('saveBtn');
  const msg = document.getElementById('saveMsg');
  btn.disabled = true;
  btn.textContent = '⏳ Se salvează...';

  CURRENCIES = CURRENCIES.map((r, i) => ({
    code: r.code,
    buy: readValidNumber('buy-' + i, r.buy),
    sell: readValidNumber('sell-' + i, r.sell)
  }));
  GOLD = {
    k14: readValidNumber('adm-g14', GOLD.k14),
    k18: readValidNumber('adm-g18', GOLD.k18)
  };

  try {
    await set(hermesRef, { rates: CURRENCIES, gold: GOLD });
    renderDisplay();
    msg.textContent = '✓ Salvat cu succes!';
    msg.className = 'save-msg ok';
  } catch (e) {
    msg.textContent = '✕ Eroare: ' + e.message;
    msg.className = 'save-msg err';
  }
  btn.disabled = false;
  btn.textContent = '✓ SALVEAZĂ TOT';
  setTimeout(() => { msg.textContent = ''; msg.className = 'save-msg'; }, 4000);
};

load();
setInterval(load, 60000);
</script>
