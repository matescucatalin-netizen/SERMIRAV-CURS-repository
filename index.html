<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERMIRAV HERMES — TV & Panou LED</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700;900&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#050E0A;
  font-family:'Oswald', sans-serif;
  color:#FFF;
  overflow:hidden;
  width:100vw;
  height:100vh;
}
#display {
  width:100vw;
  height:100vh;
  padding:1vh 2.5vw 0.5vh 2.5vw;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}
.header {
  text-align:center;
  padding-bottom:0.2vh;
  margin-bottom:0vh;
  border-bottom:3px solid #F2C660;
  flex:0 0 auto;
}
.title-card {
  display:flex;
  align-items:center;
  justify-content:center;
  width:90vw;
  padding:0.8vh 2vw;
  margin-bottom:0vh;
  margin-left:auto;
  margin-right:auto;
  border-radius:10px;
  box-sizing:border-box;
  background:linear-gradient(135deg, #F7E3A1 0%, #6B4E12 55%, #050E0A 100%);
  border:2px solid #FFE9A8;
  position:relative;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 14px rgba(232,200,122,0.5);
}
.logo-name {
  font-size:7.5vw;
  font-weight:900;
  letter-spacing:1.5px;
  line-height:1;
  position:relative;
  z-index:1;
  white-space:nowrap;
  background:linear-gradient(90deg, #F0FFF8, #FFFFFF, #E0FFF0, #FFFFFF, #F0FFF8);
  background-size:200% auto;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  text-shadow:0 2px 8px rgba(184,134,11,0.4);
}
.cube-wrap {
  perspective:600px;
  height:8.5vw;
  margin-top:0.3vh;
  flex:0 0 auto;
  width:auto;
  min-width:66vw;
}
.cube {
  position:relative;
  width:100%;
  height:100%;
  transform-style:preserve-3d;
  animation:cubeFlip 7s ease-in-out infinite;
}
.cube-face {
  position:absolute;
  inset:0;
  backface-visibility:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:7vw;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
  white-space:nowrap;
  background:linear-gradient(90deg, #B8860B, #FFE9A8, #F2C660, #FFE9A8, #B8860B);
  background-size:200% auto;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.cube-face.front { transform:rotateX(0deg) translateZ(4vw); }
.cube-face.back { transform:rotateX(180deg) translateZ(4vw); }
@keyframes cubeFlip {
  0%,42% { transform:rotateX(0deg); }
  50%,92% { transform:rotateX(180deg); }
  100% { transform:rotateX(360deg); }
}
.col-headers {
  display:grid;
  grid-template-columns:18% 82%;
  padding:0 0 0.2vh 0;
  margin-top:-1.2vh;
  flex:0 0 auto;
  align-items:center;
}
.col-h-valuta {
  display:flex;
  align-items:center;
  justify-content:flex-start;
}
.col-h-cubes-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1.5vw;
  width:100%;
}
.slot-wrap {
  position:relative;
  height:4.8vh;
  width:100%;
  overflow:hidden;
}
.col-h-txt {
  font-size:5vw;
  font-weight:900;
  letter-spacing:1.5px;
  text-transform:uppercase;
  line-height:1;
  background:linear-gradient(180deg, #FFFFFF 0%, #FFF3C4 100%);
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  -webkit-text-stroke:0.4px #B8860B;
}
#ratesTable {
  flex:1 1 auto;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  width:100%;
  margin:0.15vh 0 0.35vh 0;
}
.rate-row {
  display:grid;
  grid-template-columns:18% 82%;
  align-items:stretch;
  flex:1 1 0;
  min-height:0;
  width:100%;
}
.code-wrap {
  display:flex;
  align-items:center;
  justify-content:flex-start;
  width:100%;
  height:90%;
  overflow:hidden;
  position:relative;
}
.code {
  font-size:9.9vw;
  font-weight:900;
  display:inline-block;
  line-height:1;
  transform:scaleX(0.78) scaleY(1.55);
  transform-origin:left center;
  white-space:nowrap;
  background:linear-gradient(90deg, #B8860B, #FFE9A8, #F2C660, #FFE9A8, #B8860B);
  background-size:200% auto;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.rate-card-grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:1.5vw;
  width:100%;
  height:90%;
  align-items:center;
}
.rate-card {
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:0.6vw;
  overflow:hidden;
  width:100%;
  height:100%;
}
.val {
  font-size:9.9vw;
  font-weight:900;
  line-height:1;
  display:flex;
  justify-content:center;
  align-items:center;
  box-sizing:border-box;
  width:100%;
  height:100%;
  white-space:nowrap;
  transform:scaleY(1.45);
  transform-origin:center center;
}
.digit { display:inline-block; width:0.58em; text-align:center; }
.digit-dot { display:inline-block; width:0.22em; text-align:center; }
.buy { color:#FFFFFF; background:linear-gradient(135deg, #FFE9A8 0%, #F2C660 15%, #C9A227 40%, #A6791A 60%, #8B6508 78%, #4A3308 100%); }
.sell { color:#FFFFFF; background:linear-gradient(135deg, #FF9494 0%, #E23C3C 15%, #B33030 40%, #921F1F 60%, #6E1414 78%, #350808 100%); }
.gold-section {
  padding-top:0.2vh;
  margin-top:0vh;
  text-align:center;
  flex:0 0 auto;
}
.gold-title-bar {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:2.8vw;
  margin-bottom:0.4vh;
}
.gold-title-bar::before, .gold-title-bar::after {
  content:''; flex:1; max-width:12vw; height:4px;
  background:linear-gradient(90deg, transparent, #FFD700, transparent);
}
.gold-cube-wrap { height:8.5vw; flex:0 0 auto; width:auto; min-width:58vw; }
.gold-face {
  font-size:7.5vw; letter-spacing:1px;
  background:linear-gradient(90deg, #B8860B, #FFE9A8, #F2C660, #FFE9A8, #B8860B);
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.gold-face.front { transform:rotateX(0deg) translateZ(3.5vw); }
.gold-face.back { transform:rotateX(180deg) translateZ(3.5vw); }
.gold-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.6vh 2.5vw; margin-bottom:0.8vh; border-radius:12px;
  background:linear-gradient(135deg, #6B4E12 0%, #A67C1E 45%, #6B4E12 100%);
  border:2px solid #FFD98A; position:relative; overflow:hidden;
  box-shadow:0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
}
.gold-txt { color:#FFFFFF; font-size:7vw; font-weight:900; letter-spacing:1px; white-space:nowrap; }
.gold-val-wrap { display:flex; align-items:baseline; justify-content:flex-end; gap:1.2vw; white-space:nowrap; }
.gold-upto { font-size:4vw; font-weight:700; color:#FFFFFF; letter-spacing:1px; text-transform:uppercase; }
.gold-val { font-size:7.5vw; font-weight:900; color:#FFFFFF; letter-spacing:1px; }
.gold-currency { font-size:6.3vw; font-weight:900; color:#FFFFFF; letter-spacing:1px; }
.loading-msg { color:#888E99; text-align:center; font-size:4vw; padding:4vh 0; }
</style>
</head>
<body>
<div id="display">
    <div class="header">
        <div class="title-card"><div class="logo-name">SERMIRAV HERMES</div></div>
        <div class="gold-title-bar cube-wrap">
          <div class="cube">
            <div class="cube-face front">Schimb Valutar</div>
            <div class="cube-face back">Cursuri Negociabile</div>
          </div>
        </div>
    </div>
    <div class="col-headers">
        <div class="col-h-valuta"><span class="col-h-txt">VALUTA</span></div>
        <div class="col-h-cubes-grid">
            <div class="slot-wrap"><span class="col-h-txt">CUMPĂRĂM</span></div>
            <div class="slot-wrap"><span class="col-h-txt">VINDEM</span></div>
        </div>
    </div>
    <div id="ratesTable"><div class="loading-msg">Se încarcă...</div></div>
    <div class="gold-section">
        <div class="gold-title-bar">
          <div class="cube-wrap gold-cube-wrap">
            <div class="cube">
              <div class="cube-face gold-face front">Amanet Aur</div>
              <div class="cube-face gold-face back">Cumparam Aur</div>
            </div>
          </div>
        </div>
        <div class="gold-item">
            <div class="gold-txt">AUR 14K</div>
            <div class="gold-val-wrap">
              <span class="gold-upto">PÂNĂ LA</span>
              <span id="g14" class="gold-val">325</span>
              <span class="gold-currency">LEI/G</span>
            </div>
        </div>
        <div class="gold-item">
            <div class="gold-txt">AUR 18K</div>
            <div class="gold-val-wrap">
              <span class="gold-upto">PÂNĂ LA</span>
              <span id="g18" class="gold-val">405</span>
              <span class="gold-currency">LEI/G</span>
            </div>
        </div>
    </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, onValue } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyD7K-y9cX-fPbpGOetaCTwe8G8gpMy-ML0",
  authDomain: "sermirav-exchange.firebaseapp.com",
  databaseURL: "https://sermirav-exchange-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sermirav-exchange",
  storageBucket: "sermirav-exchange.firebasestorage.app",
  messagingSenderId: "913088674029",
  appId: "1:913088674029:web:8c3a77e3c5f5925a7fb4e4"
};

const db = getDatabase(initializeApp(firebaseConfig));

// ATENȚIE: 
// Pentru pagina principală (index.html), folosește: 'hermesSimplu'
// Pentru TV / Panou LED (tv.html), folosește direct: 'hermesSimplu' (sau 'hermesTv' dacă ai creat un nod separat)
const displayRef = ref(db, 'hermesSimplu');

function tabularNum(str) {
  return str.split('').map(ch => {
    if (ch >= '0' && ch <= '9') return `<span class="digit">${ch}</span>`;
    return `<span class="digit-dot">${ch}</span>`;
  }).join('');
}

function updateDisplay(data) {
  if (!data) return;
  
  if (Array.isArray(data.rates)) {
    document.getElementById('ratesTable').innerHTML = data.rates.map(r => `
      <div class="rate-row">
        <div class="code-wrap"><div class="code">${r.code}</div></div>
        <div class="rate-card-grid">
          <div class="rate-card buy"><div class="val">${tabularNum(Number(r.buy).toFixed(4))}</div></div>
          <div class="rate-card sell"><div class="val">${tabularNum(Number(r.sell).toFixed(4))}</div></div>
        </div>
      </div>
    `).join('');
  }

  if (data.gold) {
    if (data.gold.k14) document.getElementById('g14').innerText = data.gold.k14;
    if (data.gold.k18) document.getElementById('g18').innerText = data.gold.k18;
  }
}

// Ascultare în timp real direct din Firebase (fără suprasolicitare, optimizat pentru TV/VNNOX)
onValue(displayRef, (snapshot) => {
  const data = snapshot.val();
  updateDisplay(data);
}, (error) => {
  document.getElementById('ratesTable').innerHTML = `<div class="loading-msg">Eroare conexiune: ${error.message}</div>`;
});

// Auto-refresh de siguranță o dată la 4 ore împotriva blocării playerului pe termen lung
setTimeout(() => { window.location.reload(true); }, 14400000);
</script>
</body>
</html>
