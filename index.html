<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERMIRAV HERMES — Display</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#050E0A; font-family:'Oswald', sans-serif; color:#FFF; overflow:hidden; width:100vw; height:100vh; }
#display { width:100vw; height:100vh; padding: 1vh 2.5vw 0.5vh 2.5vw; display:flex; flex-direction:column; justify-content:space-between; }

/* HEADER */
.header {
  text-align:center; padding-bottom:0.2vh; margin-bottom:0vh;
  border-bottom:3px solid #F2C660; flex:0 0 auto;
}
.title-card {
  display:flex; align-items:center; justify-content:center; width:90vw;
  padding:0.8vh 2vw; margin-bottom:0vh; margin-left:auto; margin-right:auto; border-radius:10px; box-sizing:border-box;
  background:linear-gradient(135deg, #F7E3A1 0%, #6B4E12 55%, #050E0A 100%);
  border:2px solid #FFE9A8;
  position:relative; overflow:hidden;
  animation: goldBreathe 3s ease-in-out infinite;
}
.title-card::before {
  content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.25), transparent);
  transform:skewX(-20deg);
  animation: goldShine 2s ease-in-out infinite;
}
.title-card::after { content:none; }
@keyframes goldBreathe {
  0%, 100% { box-shadow: 0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 8px rgba(232,200,122,0.25); }
  50% { box-shadow: 0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15), 0 0 22px rgba(232,200,122,0.75); }
}
.logo-name {
  font-size:7.5vw; font-weight:900; letter-spacing:1.5px; line-height:1; position:relative; z-index:1; white-space:nowrap;
  background:linear-gradient(90deg, #F0FFF8, #FFFFFF, #E0FFF0, #FFFFFF, #F0FFF8);
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  animation: shimmerText 5s linear infinite;
  text-shadow:0 2px 8px rgba(184,134,11,0.4);
}
@keyframes shimmerText { 0%{background-position:0% center;} 100%{background-position:200% center;} }

.cube-wrap { perspective:600px; height:8.5vw; margin-top:0.3vh; flex:0 0 auto; width:auto; min-width:66vw; }
.cube { position:relative; width:100%; height:100%; transform-style:preserve-3d; animation: cubeFlip 7s ease-in-out infinite; }
.cube-face {
  position:absolute; inset:0; backface-visibility:hidden;
  display:flex; align-items:center; justify-content:center;
  font-size:7vw; font-weight:900; letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap;
  background:linear-gradient(90deg, #B8860B, #FFE9A8, #F2C660, #FFE9A8, #B8860B);
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
}
.cube-face.front { transform:rotateX(0deg) translateZ(4vw); }
.cube-face.back { transform:rotateX(180deg) translateZ(4vw); }
@keyframes cubeFlip {
  0%, 42% { transform:rotateX(0deg); }
  50%, 92% { transform:rotateX(180deg); }
  100% { transform:rotateX(360deg); }
}

/* ANTET TABEL */
.col-headers { display:grid; grid-template-columns: 7% 44% 49%; padding:0.2vh 0 0vh 0; margin-bottom:0vh; column-gap:0.8vw; flex:0 0 auto; }
.col-h { display:flex; flex-direction:column; align-items:center; }
.col-h-ro { font-size:4.6vw; font-weight:700; letter-spacing:2px; text-transform:uppercase; color:#F2C660; }
.col-h-en { font-size:4.2vw; font-weight:900; letter-spacing:1px; text-transform:uppercase; color:#8A6508; margin-top:0.1vh; -webkit-text-stroke:0.6px #8A6508; }
.col-h:first-child { align-items:flex-start; }
.col-h:nth-child(2) { padding-left:19vw; }
.col-h:last-child { align-items:center; padding-left:8vw; padding-right:0vw; }

/* TABEL VALUTE & CASETE CIFRE */
#ratesTable { 
  flex:1 1 auto; 
  display:flex; 
  flex-direction:column; 
  justify-content:space-between; 
  width:100%; 
  margin:0.2vh 0 0.5vh 0;
}
.rate-row { 
  display:grid; 
  grid-template-columns: 18% 82%; 
  align-items:stretch; 
  flex:1; 
  width:100%; 
}
.code-wrap { display:flex; align-items:center; justify-content:flex-start; width:100%; overflow:hidden; }

.code {
  font-size:13vw; font-weight:900; display:inline-block; line-height:1; transform:scaleX(0.78); transform-origin:left center; white-space:nowrap;
  background:linear-gradient(90deg, #B8860B, #FFE9A8, #F2C660, #FFE9A8, #B8860B);
  background-size:200% auto;
  -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
  animation: shimmerText 5s linear infinite;
}

.rate-card-grid {
  display:grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5vw;
  width: 100%;
  height: 100%;
  align-items: center;
}

.rate-card { 
  display:flex; justify-content:stretch; align-items:center; border-radius:0.6vw; overflow:hidden; 
  box-shadow: 0 2px 6px rgba(0,0,0,0.4); width:100%; padding:0 3%; height:93%;
}

.val { 
  font-size:14.4vw; font-weight:900; line-height:0.8; 
  display:flex; justify-content:space-between; align-items:center; 
  box-sizing:border-box; width:100%; padding:0; white-space:nowrap; 
  -webkit-text-stroke:0.2px currentColor; text-align:center;
}
.val.flipping { animation: flipVal 0.6s ease-in-out; }
@keyframes flipVal {
  0% { transform: rotateX(0deg); }
  45% { transform: rotateX(-95deg); }
  55% { transform: rotateX(-95deg); }
  100% { transform: rotateX(0deg); }
}
.digit { display:inline-flex; justify-content:center; align-items:center; flex:0 0 auto; }
.digit-dot { display:inline-flex; justify-content:center; align-items:center; flex:0 0 auto; }

.buy {
  color:#ffffff; -webkit-text-stroke:0.8px #3A2500; paint-order:stroke fill;
  background:linear-gradient(135deg, #996A00 0%, #F2C660 45%, #996A00 100%);
  border:2px solid #FFE9A8;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.4), 0 0 10px rgba(242,198,96,0.3);
}
.sell {
  color:#ffffff; -webkit-text-stroke:1px #3A0000; paint-order:stroke fill;
  background:linear-gradient(135deg, #7A1414 0%, #C93030 45%, #7A1414 100%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.2);
}

/* SECTIUNEA AUR */
.gold-section { padding-top:0; margin-top:-0.5vh; text-align:center; flex:0 0 auto; }
.gold-title-bar { display:flex; align-items:center; justify-content:center; gap:2.8vw; margin-bottom:0.2vh; }
.gold-title-bar::before, .gold-title-bar::after { content:''; flex:1; max-width:12vw; height:4px; background:linear-gradient(90deg, transparent, #FFD700, transparent); }
.gold-cube-wrap { height:9vw; flex:0 0 auto; width:auto; min-width:58vw; }
.gold-face { font-size:8vw; letter-spacing:1px; background:linear-gradient(90deg, #B8860B, #FFE9A8, #F2C660, #FFE9A8, #B8860B); background-size:200% auto; -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
.gold-face.front { transform:rotateX(0deg) translateZ(3.5vw); }
.gold-face.back { transform:rotateX(180deg) translateZ(3.5vw); }
.gold-item {
  display:flex; align-items:center; justify-content:space-between;
  padding:0.9vh 4vw; margin-bottom:0.63vh; border-radius:12px;
  background:linear-gradient(135deg, #B8860B 0%, #F2C660 45%, #B8860B 100%);
  border:2px solid #FFE9A8;
  position:relative; overflow:hidden;
  box-shadow: 0 4px 14px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.15);
}
.gold-item::before {
  content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
  background:linear-gradient(120deg, transparent, rgba(255,255,255,0.25), transparent);
  transform:skewX(-20deg);
  animation: goldShine 2s ease-in-out infinite;
}
.gold-item::after { content:none; }
@keyframes goldShine { 0%{left:-60%;} 45%{left:130%;} 100%{left:130%;} }
.gold-txt { font-size:6.5vw; font-weight:900; color:#FFFFFF; letter-spacing:1px; text-transform:uppercase; z-index:1; }
.gold-val-wrap { text-align:right; z-index:1; display:flex; align-items:baseline; justify-content:flex-end; gap:1vw; }
.gold-upto { font-size:2.1vw; font-weight:700; color:#FFFFFF; letter-spacing:1px; text-transform:uppercase; }
.gold-val { font-size:7vw; font-weight:900; color:#FFFFFF; letter-spacing:1px; line-height:1; text-shadow:0 2px 4px rgba(0,0,0,0.4); }
.gold-currency { font-size:7vw; font-weight:900; color:#FFFFFF; letter-spacing:1px; text-shadow:0 2px 4px rgba(0,0,0,0.4); }
.loading-msg { color:#888E99; text-align:center; font-size:4vw; padding:4vh 0; }

/* ADMIN PANEL */
#admin { display:none; position:fixed; inset:0; background:#050608; z-index:9999; padding:20px; overflow-y:auto; }
.admin-panel { max-width:600px; margin:0 auto; background:#14171E; border-radius:14px; border:2px solid #FFF; padding:20px; }
.admin-panel h2 { color:#00FF66; text-align:center; margin-bottom:20px; }
.admin-row-header { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:6px; text-align:center; font-size:13px; letter-spacing:1px; color:#888E99; }
.admin-row { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:10px; align-items:center; }
.admin-row span { color:#00FF66; font-weight:900; }
.admin-input { background:#0B0C10; border:2px solid #FFF; color:#00FF66; font-size:20px; padding:10px; text-align:center; border-radius:6px; width:100%; font-family:'Oswald',sans-serif; }
.admin-input:focus { outline:none; border-color:#00FF66; }
.gold-title { color:#00FF66; margin:20px 0 10px; font-size:16px; letter-spacing:2px; text-align:center; }
.btn-save { width:100%; padding:18px; background:#FFF; border:none; color:#000; font-weight:900; font-size:18px; letter-spacing:2px; cursor:pointer; margin-top:16px; border-radius:8px; }
.btn-save:disabled { opacity:0.4; }
.btn-close { width:100%; margin-top:10px; padding:12px; background:none; border:1px solid #888E99; color:#888E99; border-radius:8px; cursor:pointer; font-family:'Oswald',sans-serif; letter-spacing:2px; }
.save-msg { text-align:center; margin-top:12px; font-weight:900; min-height:20px; }
.save-msg.ok { color:#3EE07A; }
.save-msg.err { color:#FF4D4D; }
</style>
</head>
<body>

<div id="display">
    <div class="header">
        <div class="title-card"><div class="logo-name">SERMIRAV HERMES</div></div>
        <div class="gold-title-bar cube-wrap">
          <div class="cube">
            <div class="cube-face front">Schimb Valutar</div>
            <div class="cube-face back">Cursuri Negociabile</div>
          </div>
        </div>
    </div>
    <div class="col-headers">
        <div class="col-h"><span class="col-h-ro">ValutĂ</span></div>
        <div class="col-h"><span class="col-h-ro">Cumparam</span><span class="col-h-en">We Buy</span></div>
        <div class="col-h"><span class="col-h-ro">Vindem</span><span class="col-h-en">We Sell</span></div>
    </div>
    <div id="ratesTable"><div class="loading-msg">Se încarcă...</div></div>
    <div class="gold-section">
        <div class="gold-title-bar">
          <div class="cube-wrap gold-cube-wrap">
            <div class="cube">
              <div class="cube-face gold-face front">Amanet Aur</div>
              <div class="cube-face gold-face back">Cumparam Aur</div>
            </div>
          </div>
        </div>
        <div class="gold-item">
            <div class="gold-txt">Aur 14K</div>
            <div class="gold-val-wrap"><span class="gold-upto">până la</span><div class="gold-val"><span id="g14">--</span> <span class="gold-currency">LEI/G</span></div></div>
        </div>
        <div class="gold-item">
            <div class="gold-txt">Aur 18K</div>
            <div class="gold-val-wrap"><span class="gold-upto">până la</span><div class="gold-val"><span id="g18">--</span> <span class="gold-currency">LEI/G</span></div></div>
        </div>
    </div>
</div>

<div id="admin">
    <div class="admin-panel">
        <h2>PANOU ADMIN</h2>
        <div class="admin-row-header"><span>Valută</span><span>Cumpărăm</span><span>Vindem</span></div>
        <div id="adminRows"></div>
        <div class="gold-title">AUR (LEI/GRAM)</div>
        <div class="admin-row-header"><span>Tip</span><span>Preț "până la"</span><span></span></div>
        <div class="admin-row">
            <span>AUR 14K</span>
            <input type="number" id="adm-g14" class="admin-input" step="0.01">
            <span></span>
        </div>
        <div class="admin-row">
            <span>AUR 18K</span>
            <input type="number" id="adm-g18" class="admin-input" step="0.01">
            <span></span>
        </div>
        <button class="btn-save" id="saveBtn" onclick="saveAll()">✓ SALVEAZĂ TOT</button>
        <button class="btn-close" onclick="closeAdmin()">ÎNCHIDE</button>
        <div class="save-msg" id="saveMsg"></div>
    </div>
</div>

<button onclick="openAdmin()" style="position:fixed; bottom:0; right:0; opacity:0; width:60px; height:60px; border:none; background:none;"></button>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getDatabase, ref, get, set } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

const firebaseConfig = {
  apiKey: "AIzaSyD7K-y9cX-fPbpGOetaCTwe8G8gpMy-ML0",
  authDomain: "sermirav-exchange.firebaseapp.com",
  databaseURL: "https://sermirav-exchange-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "sermirav-exchange",
  storageBucket: "sermirav-exchange.firebasestorage.app",
  messagingSenderId: "913088674029",
  appId: "1:913088674029:web:8c3a77e3c5f5925a7fb4e4"
};
const db = getDatabase(initializeApp(firebaseConfig));
const hermesRef = ref(db, 'hermesSimplu');

const DEFAULT_DATA = {
  rates: [
    { code:'EUR', buy:5.1850, sell:5.2320 },
    { code:'USD', buy:4.4490, sell:4.5300 },
    { code:'GBP', buy:6.0090, sell:6.1100 },
    { code:'CHF', buy:5.5090, sell:5.5950 },
    { code:'CAD', buy:3.1250, sell:3.2650 },
    { code:'AUD', buy:2.6900, sell:3.1100 },
    { code:'PLN', buy:1.1050, sell:1.2550 },
    { code:'TRY', buy:0.0950, sell:0.1190 },
    { code:'HUF', buy:0.0132, sell:0.0149 }
  ],
  gold: { k14: 315, k18: 390 }
};

window.openAdmin = () => {
  const p = prompt("Parolă:");
  if (p === '2580') {
    renderAdmin();
    document.getElementById('admin').style.display = 'block';
  } else if (p !== null) {
    alert('Parolă incorectă');
  }
};
window.closeAdmin = () => { document.getElementById('admin').style.display = 'none'; };

let secretBuffer = '', secretTimer = null;
document.addEventListener('keydown', function(e) {
  if (e.target.tagName === 'INPUT') return;
  secretBuffer += e.key;
  if (secretTimer) clearTimeout(secretTimer);
  secretTimer = setTimeout(() => { secretBuffer = ''; }, 2000);
  if (secretBuffer.includes('2580')) {
    secretBuffer = '';
    renderAdmin();
    document.getElementById('admin').style.display = 'block';
  }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') window.closeAdmin(); });

let CURRENCIES = DEFAULT_DATA.rates.map(r => ({ ...r }));
let GOLD = { ...DEFAULT_DATA.gold };

function tabularNum(str) {
  return str.split('').map(ch => {
    if (ch >= '0' && ch <= '9') return `<span class="digit">${ch}</span>`;
    return `<span class="digit-dot">${ch}</span>`;
  }).join('');
}

let lastRendered = {};

function renderDisplay() {
  const isFirstRender = Object.keys(lastRendered).length === 0;
  document.getElementById('ratesTable').innerHTML = CURRENCIES.map(r => `
    <div class="rate-row">
      <div class="code-wrap"><div class="code">${r.code}</div></div>
      <div class="rate-card-grid">
        <div class="rate-card buy">
          <div class="val" data-code="${r.code}" data-field="buy">${tabularNum(r.buy.toFixed(4))}</div>
        </div>
        <div class="rate-card sell">
          <div class="val" data-code="${r.code}" data-field="sell">${tabularNum(r.sell.toFixed(4))}</div>
        </div>
      </div>
    </div>
  `).join('');
  document.getElementById('g14').innerText = GOLD.k14;
  document.getElementById('g18').innerText = GOLD.k18;

  if (!isFirstRender) {
    CURRENCIES.forEach(r => {
      const prev = lastRendered[r.code];
      if (!prev) return;
      if (prev.buy !== r.buy) {
        const el = document.querySelector(`.val[data-code="${r.code}"][data-field="buy"]`);
        if (el) { el.classList.remove('flipping'); void el.offsetWidth; el.classList.add('flipping'); }
      }
      if (prev.sell !== r.sell) {
        const el = document.querySelector(`.val[data-code="${r.code}"][data-field="sell"]`);
        if (el) { el.classList.remove('flipping'); void el.offsetWidth; el.classList.add('flipping'); }
      }
    });
  }

  lastRendered = {};
  CURRENCIES.forEach(r => { lastRendered[r.code] = { buy: r.buy, sell: r.sell }; });
}

function renderAdmin() {
  document.getElementById('adminRows').innerHTML = CURRENCIES.map((r, i) => `
    <div class="admin-row">
      <span>${r.code}</span>
      <input type="number" id="buy-${i}" class="admin-input" value="${r.buy}" step="0.0001">
      <input type="number" id="sell-${i}" class="admin-input" value="${r.sell}" step="0.0001">
    </div>
  `).join('');
  document.getElementById('adm-g14').value = GOLD.k14;
  document.getElementById('adm-g18').value = GOLD.k18;
}

function isAdminOpen() {
  return document.getElementById('admin').style.display === 'block';
}

async function load() {
  if (isAdminOpen()) return;
  try {
    const snap = await get(hermesRef);
    const d = snap.val();
    if (d && Array.isArray(d.rates)) {
      d.rates.forEach(r => {
        const idx = CURRENCIES.findIndex(c => c.code === r.code);
        if (idx >= 0) { CURRENCIES[idx].buy = r.buy; CURRENCIES[idx].sell = r.sell; }
      });
    }
    if (d && d.gold) {
      if (typeof d.gold.k14 === 'number') GOLD.k14 = d.gold.k14;
      if (typeof d.gold.k18 === 'number') GOLD.k18 = d.gold.k18;
    }
    if (!d) {
      await set(hermesRef, { rates: CURRENCIES, gold: GOLD });
    }
    renderDisplay();
    renderAdmin();
  } catch (e) {
    document.getElementById('ratesTable').innerHTML = `<div class="loading-msg">Eroare la încărcare: ${e.message}</div>`;
  }
}

window.saveAll = async () => {
  const btn = document.getElementById('saveBtn');
  const msg = document.getElementById('saveMsg');
  btn.disabled = true;
  btn.textContent = '⏳ Se salvează...';

  CURRENCIES = CURRENCIES.map((r, i) => ({
    code: r.code,
    buy: parseFloat(document.getElementById('buy-' + i).value) || r.buy,
    sell: parseFloat(document.getElementById('sell-' + i).value) || r.sell
  }));
  GOLD = {
    k14: parseFloat(document.getElementById('adm-g14').value) || GOLD.k14,
    k18: parseFloat(document.getElementById('adm-g18').value) || GOLD.k18
  };

  try {
    await set(hermesRef, { rates: CURRENCIES, gold: GOLD });
    renderDisplay();
    msg.textContent = '✓ Salvat cu succes!';
    msg.className = 'save-msg ok';
  } catch (e) {
    msg.textContent = '✕ Eroare: ' + e.message;
    msg.className = 'save-msg err';
  }
  btn.disabled = false;
  btn.textContent = '✓ SALVEAZĂ TOT';
  setTimeout(() => { msg.textContent = ''; msg.className = 'save-msg'; }, 4000);
};

load();
setInterval(load, 30000);
</script>
</body>
</html>
