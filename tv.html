<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sermirav Hermes - TV Display</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #0b0d12;
            color: #ffffff;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            padding: 20px 30px;
        }

        /* Antet */
        header {
            text-align: center;
            padding-bottom: 10px;
            border-bottom: 3px solid #F2C660;
            margin-bottom: 20px;
        }

        header h1 {
            color: #F2C660;
            font-size: 3.2rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(242, 198, 96, 0.3);
        }

        /* Layout Principal Landscape (2 Coloane) */
        .main-container {
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 25px;
            height: calc(100vh - 130px);
        }

        /* Tabel Valutar */
        .exchange-table {
            width: 100%;
            border-collapse: collapse;
            background-color: #141721;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .exchange-table th {
            background-color: #1e2330;
            color: #F2C660;
            font-size: 1.5rem;
            padding: 16px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .exchange-table td {
            padding: 20px 15px;
            text-align: center;
            font-size: 2.4rem;
            font-weight: bold;
            border-bottom: 1px solid #232938;
        }

        .currency-name {
            color: #fff;
            text-align: left !important;
            padding-left: 30px !important;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rate-buy {
            color: #2ecc71;
            background-color: rgba(46, 204, 113, 0.05);
        }

        .rate-sell {
            color: #e74c3c;
            background-color: rgba(231, 76, 60, 0.05);
        }

        /* Coloana Dreaptă (Aur + Card) */
        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .gold-section {
            background-color: #141721;
            border: 2px solid #F2C660;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .gold-title {
            color: #F2C660;
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .gold-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.6rem;
            margin: 10px 0;
            padding: 10px 15px;
            background-color: #1e2330;
            border-radius: 8px;
        }

        .gold-value {
            color: #F2C660;
            font-weight: bold;
            font-size: 1.8rem;
        }

        /* Secțiunea Plată cu Cardul */
        .card-section {
            background: linear-gradient(135deg, #1a233a, #0d1322);
            border: 2px solid #3498db;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .card-title {
            color: #3498db;
            font-size: 1.8rem;
            font-weight: bold;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .card-subtext {
            color: #ccc;
            font-size: 1.3rem;
            margin-bottom: 20px;
        }

        .card-badges {
            display: flex;
            gap: 15px;
            font-size: 1.3rem;
            font-weight: bold;
            background: #141721;
            padding: 12px 25px;
            border-radius: 30px;
            color: #fff;
            border: 1px solid #3498db;
        }

        .card-badges span {
            color: #F2C660;
        }
    </style>
</head>
<body>

    <header>
        <h1>SERMIRAV HERMES</h1>
    </header>

    <div class="main-container">
        <!-- Tabel Curs Valutar -->
        <table class="exchange-table">
            <thead>
                <tr>
                    <th style="text-align: left; padding-left: 30px;">VALUTĂ</th>
                    <th>CUMPĂRĂM</th>
                    <th>VINDEM</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td class="currency-name">EUR</td>
                    <td class="rate-buy" id="eur-buy">4.90</td>
                    <td class="rate-sell" id="eur-sell">4.98</td>
                </tr>
                <tr>
                    <td class="currency-name">USD</td>
                    <td class="rate-buy" id="usd-buy">4.50</td>
                    <td class="rate-sell" id="usd-sell">4.62</td>
                </tr>
                <tr>
                    <td class="currency-name">GBP</td>
                    <td class="rate-buy" id="gbp-buy">5.70</td>
                    <td class="rate-sell" id="gbp-sell">5.85</td>
                </tr>
                <tr>
                    <td class="currency-name">CHF</td>
                    <td class="rate-buy" id="chf-buy">5.00</td>
                    <td class="rate-sell" id="chf-sell">5.15</td>
                </tr>
            </tbody>
        </table>

        <!-- Panou Lateral: Aur & Card -->
        <div class="side-panel">
            <div class="gold-section">
                <div class="gold-title">AMANET / CUMPĂRĂM AUR</div>
                <div class="gold-row">
                    <span>AUR 14K</span>
                    <span class="gold-value" id="gold-14k">325 LEI/G</span>
                </div>
                <div class="gold-row">
                    <span>AUR 18K</span>
                    <span class="gold-value" id="gold-18k">405 LEI/G</span>
                </div>
            </div>

            <div class="card-section">
                <div class="card-title">ACCEPTĂM PLATĂ CU CARDUL</div>
                <div class="card-subtext">Plăți rapide și sigure la ghișeu</div>
                <div class="card-badges">
                    <span>POS</span> • <span>VISA</span> • <span>MASTERCARD</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de auto-refresh la fiecare 3 minute pentru stabilitatea TV-ului LG -->
    <script>
        setInterval(function() {
            location.reload();
        }, 180000);
    </script>
</body>
</html>
