<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sermirav Exchange Hermes</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700;900&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#f4f6f9; font-family:'Oswald', sans-serif; }

/* HEADER NOU CU LOGO ȘI TEXT DUBLU */
.header { 
  height: 14vh;
  background: #ffffff; 
  border-bottom: 4px solid #dcdfe4; 
  display: flex; 
  align-items: center; 
  justify-content: space-between; 
  padding: 0 3vw; 
  box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
}

/* GRUP BRAND: LOGO + TEXT */
.brand-group {
  display: flex;
  align-items: center;
  gap: 1.2vw;
}

/* ICONIȚĂ / EMBLEMĂ HERMES (SVG) */
.brand-logo-icon {
  width: 9vh;
  height: 9vh;
  background: linear-gradient(135deg, #111111 0%, #1a2a1e 100%);
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 16px rgba(0,0,0,0.15);
  border: 2px solid #e0b32c;
  flex-shrink: 0;
}

.brand-logo-icon svg {
  width: 6.5vh;
  height: 6.5vh;
}

/* BLOC TEXT DUBLU SERMIRAV EXCHANGE + HERMES */
.brand-text-block {
  display: flex;
  flex-direction: column;
  justify-content: center;
}

/* RÂNDUL 1 & 2: SERMIRAV / EXCHANGE */
.title-double {
  font-family: 'Bebas Neue', sans-serif;
  line-height: 0.88;
  display: flex;
  flex-direction: column;
}

.title-line-1 {
  font-size: 4.2vh;
  letter-spacing: 0.12em;
  color: #1a7a3a;
  background-image: linear-gradient(90deg, #1a7a3a 0%, #3ec46b 30%, #1a7a3a 60%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
}

.title-line-2 {
  font-size: 3.4vh;
  letter-spacing: 0.22em;
  color: #a37a00;
  background-image: linear-gradient(90deg, #a37a00 0%, #fadb5f 30%, #a37a00 60%);
  background-size: 200% auto;
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: shine 4s linear infinite;
}

@keyframes shine { 
  0% { background-position: 0% center; } 
  100% { background-position: 200% center; } 
}

/* LEGĂTURA CU HERMES (SUBTITLU BADGE) */
.hermes-badge {
  display: inline-flex;
  align-items: center;
  gap: 0.8vw;
  margin-top: 0.5vh;
}

.hermes-line {
  height: 2px;
  width: 2.5vw;
  background: linear-gradient(90deg, #a37a00, transparent);
}

.hermes-tag {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.2vh;
  letter-spacing: 0.4em;
  color: #ffffff;
  background: #111111;
  padding: 0.1vh 1vw 0 1.2vw;
  border-radius: 4px;
  border-left: 3px solid #e0b32c;
  box-shadow: 0 2px 6px rgba(0,0,0,0.1);
}

/* DREAPTA: VREME + CEAS */
.header-right { 
  display: flex; 
  align-items: center; 
  gap: 2vw; 
}

.weather-box {
  background: #f8f9fa;
  border: 1px solid #e9ecef;
  border-radius: 12px;
  padding: 0.6vh 1vw;
  display: flex;
  align-items: center;
  gap: 0.5vw;
  font-size: 3.2vh;
  font-weight: 700;
}

.clock-box {
  text-align: right;
  font-family: 'Bebas Neue', sans-serif;
}

.clock-time {
  font-size: 6.5vh;
  line-height: 1;
  color: #111;
}

.clock-date {
  font-family: 'Oswald', sans-serif;
  font-size: 1.3vh;
  color: #666;
  letter-spacing: 0.1em;
}
</style>
</head>
<body>

<header class="header">
  <!-- LOGO NOU + TITLU DUBLU + HERMES -->
  <div class="brand-group">
    
    <!-- EMBLEMĂ LOGO HERMES (Aripile Comerțului) -->
    <div class="brand-logo-icon">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Monedă / Cerc Central -->
        <circle cx="32" cy="32" r="14" fill="url(#goldGrad)" stroke="#ffffff" stroke-width="1.5"/>
        <path d="M32 23V41M27 28C27 26.5 29 25.5 32 25.5C35.5 25.5 37 27 37 29C37 32 27 32 27 35C27 37 28.5 38.5 32 38.5C35 38.5 37 37.5 37 36" stroke="#111111" stroke-width="2.5" stroke-linecap="round"/>
        <!-- Aripa Stânga -->
        <path d="M18 30C12 24 8 16 10 10C16 12 22 18 24 24C21 24 19 26 18 30Z" fill="url(#goldGrad)"/>
        <path d="M16 34C10 31 6 24 9 19C14 20 19 25 20 29C18 30 17 32 16 34Z" fill="url(#goldGrad)" opacity="0.8"/>
        <!-- Aripa Dreapta -->
        <path d="M46 30C52 24 56 16 54 10C48 12 42 18 40 24C43 24 45 26 46 30Z" fill="url(#goldGrad)"/>
        <path d="M48 34C54 31 58 24 55 19C50 20 45 25 44 29C46 30 47 32 48 34Z" fill="url(#goldGrad)" opacity="0.8"/>
        <!-- Gradiente Aurii -->
        <defs>
          <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#fadb5f"/>
            <stop offset="50%" stop-color="#e0b32c"/>
            <stop offset="100%" stop-color="#a37a00"/>
          </linearGradient>
        </defs>
      </svg>
    </div>

    <!-- TEXT DUBLU + LEGĂTURĂ HERMES -->
    <div class="brand-text-block">
      <div class="title-double">
        <span class="title-line-1">SERMIRAV</span>
        <span class="title-line-2">EXCHANGE</span>
      </div>
      <div class="hermes-badge">
        <span class="hermes-tag">AGENȚIA HERMES</span>
        <div class="hermes-line"></div>
      </div>
    </div>

  </div>

  <!-- BLOC DREAPTA: VREME + CEAS -->
  <div class="header-right">
    <div class="weather-box">
      <span>☀️</span>
      <span>24°C</span>
    </div>
    <div class="clock-box">
      <div class="clock-time">14:35<span style="font-size: 4vh; color: #888;">:12</span></div>
      <div class="clock-date">SÂMBĂTĂ, 29 AUG 2026</div>
    </div>
  </div>
</header>

</body>
</html>
